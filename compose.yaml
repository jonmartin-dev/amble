# Run Amble with Docker Compose. deploy/setup.sh does all of this; by hand:
#   1. cp .env.example .env and fill it in (AMBLE_PUBLIC_URL, AMBLE_TIMEZONE).
#   2. mkdir -p data secrets, and put a long random string in secrets/amble_secret. With a sign-in
#      provider, set OIDC_CLIENT_ID in .env and put its secret in secrets/oidc_client_secret.
#   3. docker compose up -d --build
#   4. docker compose exec amble node server/pair.ts admin, for the first admin's code.
services:
  amble:
    build: .
    # AMBLE_IMAGE names the image when one computer runs more than one copy (a test beside the real one).
    image: ${AMBLE_IMAGE:-amble:local}
    restart: unless-stopped
    read_only: true
    # Runs as the image's "node" user (uid 1000); ./data must be writable by it.
    user: "1000:1000"
    # The default bridge needs no new subnet, which helps on hosts whose address pools are used up.
    network_mode: bridge
    ports:
      - "127.0.0.1:${AMBLE_PORT:-18085}:8080"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      AMBLE_DATA_DIR: /data
      # What the server seals what it keeps under. Optional; without it the server makes one in data/.
      AMBLE_SECRET_FILE: /run/secrets/amble_secret
      # Optional: a sign-in provider's client secret. Without one, people get in with codes.
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      # Optional: the AI provider's key (or an Anthropic key in the older file). Leave both out to run
      # without AI, or set the model up in the app instead.
      AMBLE_AI_API_KEY_FILE: /run/secrets/ai_api_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      AMBLE_DEV_LOGIN: "0"
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets:ro
    tmpfs:
      - /tmp
